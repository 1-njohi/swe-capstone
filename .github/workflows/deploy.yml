name: CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ============================================
  # JOB 1: Run Tests
  # ============================================
  test:
    name: 🧪 Run Tests
    runs-on: ubuntu-latest
    
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: course_registration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mysqli, json, mbstring
      
      - name: 📦 Install dependencies (if any)
        run: |
          if [ -f composer.json ]; then
            composer install --no-interaction --no-progress
          fi
      
      - name: 🗄️ Wait for MySQL
        run: |
          while ! mysqladmin ping -h"127.0.0.1" --silent; do
            echo "Waiting for MySQL..."
            sleep 2
          done
      
      - name: 🗄️ Setup test database
        run: |
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS course_registration_test;"
          mysql -h 127.0.0.1 -u root -proot course_registration_test < database/schema.sql
      
      - name: 🔧 Configure test environment
        run: |
          # Create a test config file
          cat > backend/config/test_database.php << 'EOF'
          <?php
          class TestDatabase {
              private static $instance = null;
              private $conn;
              private $host = '127.0.0.1';
              private $db_name = 'course_registration_test';
              private $username = 'root';
              private $password = 'root';
              
              private function __construct() {
                  try {
                      $this->conn = new PDO(
                          "mysql:host={$this->host};dbname={$this->db_name}",
                          $this->username,
                          $this->password
                      );
                      $this->conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
                  } catch(PDOException $e) {
                      die("Connection failed: " . $e->getMessage());
                  }
              }
              
              public static function getInstance() {
                  if (self::$instance == null) {
                      self::$instance = new TestDatabase();
                  }
                  return self::$instance;
              }
              
              public function getConnection() {
                  return $this->conn;
              }
          }
          EOF
      
      - name: 🧪 Run tests
        run: |
          cd backend/tests
          php run_all_tests.php
      
      - name: 📊 Upload test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: backend/tests/test_results.json

  # ============================================
  # JOB 2: Deploy to Railway (only if tests pass)
  # ============================================
  deploy:
    name: 🚀 Deploy to Railway
    runs-on: ubuntu-latest
    needs: test
    if: success() && github.ref == 'refs/heads/main'
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3
      
      - name: 🚀 Deploy to Railway
        uses: railwayapp/railway-action@v2
        with:
          railwayToken: ${{ secrets.RAILWAY_TOKEN }}