name: CI - Run Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: 🧪 Run PHP Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: course_registration_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v3

      - name: 🔧 Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: pdo, pdo_mysql, mysqli, json, mbstring

      - name: 📦 Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: 🗄️ Wait for MySQL to be ready
        run: |
          echo "Waiting for MySQL..."
          for i in $(seq 1 30); do
            if mysqladmin ping -h"127.0.0.1" -u root -proot --silent; then
              echo "✅ MySQL is ready!"
              break
            fi
            echo "Attempt $i/30: MySQL not ready yet..."
            sleep 2
          done

      - name: 🗄️ Create test database and import schema
        run: |
          echo "Creating test database..."
          mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS course_registration_test;"
          echo "Importing schema..."
          mysql -h 127.0.0.1 -u root -proot course_registration_test < database/schema.sql
          echo "✅ Database ready!"

      - name: 🔧 Override database config for CI
        run: |
          # Ensure config directory exists
          mkdir -p backend/config
          
          cat > backend/config/database.php << 'EOF'
          <?php
          class Database {
              private static $instance = null;
              private $conn;
              private $host = '127.0.0.1';
              private $db_name = 'course_registration_test';
              private $username = 'root';
              private $password = 'root';
              
              private function __construct() {
                  try {
                      $this->conn = new PDO(
                          "mysql:host={$this->host};dbname={$this->db_name}",
                          $this->username,
                          $this->password
                      );
                      $this->conn->setAttribute(PDO::ATTR_ERRMODE, PDO::ERRMODE_EXCEPTION);
                  } catch(PDOException $e) {
                      die("Connection failed: " . $e->getMessage());
                  }
              }
              
              public static function getInstance() {
                  if (self::$instance == null) {
                      self::$instance = new Database();
                  }
                  return self::$instance;
              }
              
              public function getConnection() {
                  return $this->conn;
              }
          }
          EOF
          echo "✅ Config override created."

      - name: 🔍 Debug - Show config
        run: |
          echo "=== Database config ==="
          cat backend/config/database.php

      - name: 🧪 Run tests
        run: |
          cd backend/tests
          php run_all_tests.php

      - name: 📊 Upload test results (on failure)
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: test-results
          path: backend/tests/test_results.json